<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the app | IIEST Shibpur</title>
<meta name="description" content="Install the IIEST Shibpur student hub on Android, iPhone, Windows or Mac.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IIEST">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>
  window.__installEvent = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__installEvent = e;
    if (window.__onInstallReady) window.__onInstallReady();
  });
</script>
<style>
:root {
  --bg: #0a0a0a; --surface: #161616; --surface-2: #1e1e1e;
  --line: #2e2e2e; --line-soft: #232323; --text: #ededed;
  --dim: #9d9d9d; --dim-2: #6d6d6d; --accent-2: #c0c9ff;
  --accent-bg: rgba(154,163,189,.14); --accent-line: rgba(154,163,189,.34);
  --good: #86b39a;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; min-height: 100vh;
}
a { color: var(--accent-2); }
.wrap { width: 100%; max-width: 460px; padding: 40px 22px 60px; text-align: center; }
.tile {
  width: 68px; height: 68px; border-radius: 18px; margin: 0 auto 22px;
  display: grid; place-items: center; background: var(--surface-2);
  border: 1px solid var(--line); color: var(--dim);
}
.tile svg { width: 36px; height: 36px; }
h1 { font-size: 1.85rem; font-weight: 800; letter-spacing: -.03em; margin: 0 0 8px; }
.lede { color: var(--dim); font-size: .95rem; margin: 0 0 30px; }
.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; background: var(--accent-bg); border: 1px solid var(--accent-line);
  color: var(--accent-2); border-radius: 12px; padding: 15px 24px;
  font: 700 1rem/1 var(--sans); cursor: pointer; text-decoration: none;
  transition: border-color .14s ease, background .14s ease;
}
.cta:hover { border-color: #9aa3bd; }
.cta:disabled { opacity: .55; cursor: default; }
.cta svg { width: 19px; height: 19px; }
.plat {
  margin-top: 14px; font: 600 .68rem/1 var(--mono);
  letter-spacing: .1em; text-transform: uppercase; color: var(--dim-2);
}
.steps {
  margin-top: 26px; text-align: left; background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 20px 22px;
}
.steps p { margin: 0 0 14px; font-size: .84rem; color: var(--dim); }
.steps ol { margin: 0; padding-left: 20px; font-size: .9rem; }
.steps li { margin-bottom: 10px; }
.steps li:last-child { margin-bottom: 0; }
.steps b { color: var(--text); }
.share {
  display: inline-grid; place-items: center; width: 20px; height: 20px;
  vertical-align: -5px; border: 1px solid var(--line); border-radius: 5px;
  background: var(--surface-2);
}
.share svg { width: 12px; height: 12px; }
.done { color: var(--good); }
.alt {
  margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line-soft);
  font-size: .84rem; color: var(--dim-2);
}
.alt a { color: var(--dim); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="tile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 10.9a1 1 0 0 0 0-1.8L12.8 5.2a2 2 0 0 0-1.7 0L2.6 9.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.7 0z"/>
      <path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
    </svg>
  </div>

  <h1 id="title">Get the app</h1>
  <p class="lede" id="lede">Works offline and opens like any other app.</p>

  <button class="cta" id="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
    </svg>
    <span id="cta-text">Install</span>
  </button>
  <p class="plat" id="plat"></p>

  <div class="steps" id="steps" hidden>
    <p id="steps-intro"></p>
    <ol id="steps-list"></ol>
  </div>

  <p class="alt">
    <a href="../">Open in the browser instead</a>
  </p>
</div>

<script>
(function () {
  var ua = navigator.userAgent;
  var cta = document.getElementById("cta");
  var ctaText = document.getElementById("cta-text");
  var steps = document.getElementById("steps");
  var stepsIntro = document.getElementById("steps-intro");
  var stepsList = document.getElementById("steps-list");
  var plat = document.getElementById("plat");

  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var isMac = !isIOS && /Macintosh|Mac OS X/.test(ua);
  var isWindows = /Windows/.test(ua);
  var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
  var installed = window.matchMedia("(display-mode: standalone)").matches ||
    navigator.standalone === true;

  var name = isIOS ? "iPhone and iPad" : isAndroid ? "Android"
    : isWindows ? "Windows" : isMac ? "Mac" : "this device";
  plat.textContent = "For " + name;

  function showSteps(intro, items) {
    stepsIntro.textContent = intro;
    stepsList.innerHTML = "";
    items.forEach(function (html) {
      var li = document.createElement("li");
      li.innerHTML = html;
      stepsList.appendChild(li);
    });
    steps.hidden = false;
  }

  if (installed) {
    document.getElementById("title").textContent = "Already installed";
    document.getElementById("lede").textContent =
      "You are running the installed app right now.";
    cta.hidden = true;
    plat.hidden = true;
    return;
  }

  if (navigator.serviceWorker) {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }

  var SHARE = '<span class="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 16V3"/><path d="m8 7 4-4 4 4"/>' +
    '<path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></span>';

  function wireNative() {
    ctaText.textContent = "Install";
    cta.disabled = false;
    cta.onclick = function () {
      var e = window.__installEvent;
      if (!e) return;
      cta.disabled = true;
      e.prompt();
      e.userChoice.then(function (res) {
        window.__installEvent = null;
        if (res.outcome === "accepted") {
          ctaText.textContent = "Installed";
          cta.classList.add("done");
        } else {
          ctaText.textContent = "Install";
          cta.disabled = false;
        }
      });
    };
  }

  if (isIOS) {
    ctaText.textContent = "Show me how";
    cta.onclick = function () {
      showSteps("Apple does not allow apps to install themselves, so this is the one place it takes three taps.", [
        "Tap the <b>Share</b> button " + SHARE + " at the bottom of Safari.",
        "Scroll down and tap <b>Add to Home Screen</b>.",
        "Tap <b>Add</b>. Done.",
      ]);
      cta.disabled = true;
    };
    return;
  }

  if (isMac && isSafari) {
    ctaText.textContent = "Show me how";
    cta.onclick = function () {
      showSteps("Safari on Mac installs from its menu bar.", [
        "Open the <b>File</b> menu.",
        "Choose <b>Add to Dock</b>.",
        "Confirm. It appears in Launchpad like any Mac app.",
      ]);
      cta.disabled = true;
    };
    return;
  }

  if (window.__installEvent) {
    wireNative();
  } else {
    window.__onInstallReady = wireNative;
    ctaText.textContent = "Install";
    cta.disabled = true;
    setTimeout(function () {
      if (window.__installEvent) return;
      cta.disabled = false;
      ctaText.textContent = "Show me how";
      cta.onclick = function () {
        showSteps("Your browser did not offer a one click install. Chrome or Edge can do it.", [
          "Open this page in <b>Chrome</b> or <b>Edge</b>.",
          "Look for the <b>install icon</b> in the address bar, or open the browser menu.",
          "Choose <b>Install</b>, or <b>Add to Home screen</b> on a phone.",
        ]);
        cta.disabled = true;
      };
    }, 2500);
  }
})();
</script>
</body>
</html>
